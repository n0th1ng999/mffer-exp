[project]
name = "mffer"
version = "0.1.0"
description = "Experiments for federated multimodal multi-task emotion recognition on CREMA-D"
requires-python = ">=3.12,<3.13"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mffer*"]

[project.optional-dependencies]
dev = ["pytest", "ruff==0.12.0"]   # pre-commit is installed outside this env (brew), see README

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["notebooks"]   # exploratory; not part of the experiment code

[tool.ruff.lint]
# pyflakes + pycodestyle errors, import order, bugbear (incl. zip(strict=)), pyupgrade.
# No auto-formatter: the code is hand-aligned (tables of constants, aligned comments).
select = ["E4", "E7", "E9", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
